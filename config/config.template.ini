; ---- Map basemap (Map visualization tab + index GPS links) ----
; Leave everything blank to use the free OpenFreeMap "Positron" basemap,
; which needs no API key or account. See README.md, "Map / basemap".
;
; map_style_url: MapLibre style JSON URL, e.g.
;   https://tiles.openfreemap.org/styles/liberty
;   https://tiles.openfreemap.org/styles/bright
; or a paid provider / self-hosted style (any usage costs are yours).
map_style_url = ""
; map_attribution: attribution HTML for map_style_url. Required by most
; providers; leave blank for OpenFreeMap styles (credited automatically).
map_attribution = ""
; Optional raster tiles for browsers without WebGL, e.g.
;   https://tiles.example.org/{z}/{x}/{y}.png
; Do not use tile.openstreetmap.org (OSMF tile usage policy).
map_fallback_tile_url = ""
map_fallback_attribution = ""

